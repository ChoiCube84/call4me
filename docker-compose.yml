services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: call4me
      POSTGRES_PASSWORD: call4me
      POSTGRES_DB: call4me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U call4me"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
