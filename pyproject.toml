[project]
name = "call4me"
version = "0.1.0"
description = "A voice agent that makes customer service calls for Deaf and hard-of-hearing users."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "httpx[http2]>=0.27",
    "python-multipart>=0.0.32",
    "pyjwt[crypto]>=2.9",
    "anthropic>=2.3.0",
    "websockets>=17.3",
    "numpy>=2.4.6",
    "soxr>=1.1.0",
    "typesafe-sdk>=0.7.5",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "azure-monitor-opentelemetry>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
